name: CI

# A03:2025 — the pipeline itself is part of the supply chain. Actions are
# pinned to a full commit SHA (a mutable @v4 tag can be repointed by whoever
# controls the tag), permissions are least-privilege, and installs use `npm ci`.
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      # `npm ci` installs exactly the locked versions; `npm install` may resolve
      # a caret range to something published five minutes ago.
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.json
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sbom
          path: sbom.json
