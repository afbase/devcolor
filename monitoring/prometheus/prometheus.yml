global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'owasp-lab'
    # The lab serves HTTPS. Its cert is for localhost (mkcert) or self-signed,
    # while we scrape it by its service name 'lab', so skip verification — this
    # is a local lab, not production.
    scheme: https
    tls_config:
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ['lab:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
